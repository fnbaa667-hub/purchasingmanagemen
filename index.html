<style>
  :root{
    --bg:#eaf2fa; --card:#ffffff; --border:#e5e5e4; --border-strong:#d4d4d3;
    --text:#292826; --text-sec:#6b6a67; --text-muted:#a3a29e;
    --accent:#1d6fa5; --accent-bg:#e6f1fb;
    --danger:#c0392b; --danger-bg:#fdecea;
    --success:#1d8a5f; --success-bg:#e6f6ef;
    --warning:#a5680f; --warning-bg:#fdf2df;
    --radius:10px;
    --kb-offset:0px;

  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
  #app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg)}
  input,select,textarea{font-family:inherit;font-size:16px;padding:10px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);width:100%;background:#fff;color:var(--text)}
  button{font-family:inherit;font-size:14px;padding:10px 14px;border-radius:var(--radius);border:0.5px solid var(--border-strong);background:#fff;color:var(--text);cursor:pointer}

  button.danger{background:var(--danger);color:#fff;border:none}
  button:active{transform:scale(0.98)}
  .card{background:var(--card);border:0.5px solid var(--border);border-radius:12px;padding:16px;margin:12px}
  .row{display:flex;gap:8px;align-items:center}
  .between{display:flex;justify-content:space-between;align-items:center}
  .muted{color:var(--text-sec);font-size:13px}
  .badge{display:inline-block;font-size:11px;padding:3px 8px;border-radius:6px;font-weight:600}
  .badge-wajib{background:var(--danger-bg);color:var(--danger)}
  .badge-biasa{background:var(--accent-bg);color:var(--accent)}
  .badge-pending{background:var(--warning-bg);color:var(--warning)}
  .badge-selesai{background:var(--success-bg);color:var(--success)}
  .badge-luar{background:var(--warning-bg);color:var(--warning)}
  .topwrap{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:0.5px solid var(--border)}
  .topbar{padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
  .navbar{display:flex;overflow-x:auto;border-top:0.5px solid var(--border);padding:6px 8px;gap:4px}
  .navbtn{flex:0 0 auto;text-align:center;padding:8px 12px;font-size:12px;color:var(--text-sec);border:none;background:none;border-radius:20px;white-space:nowrap}
  .navbtn.active{color:var(--accent);font-weight:600;background:var(--accent-bg)}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:flex-start;justify-content:center;z-index:20;padding:16px;padding-bottom:calc(16px + var(--kb-offset));overflow:auto}
  .modal{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:400px;max-height:85vh;overflow:auto;margin:auto}
  .stepper{display:flex;align-items:center;gap:10px}
  .stepper button{width:40px;height:40px;padding:0;font-size:18px}
  .stepper span{flex:1;text-align:center;font-size:18px;font-weight:600}
  .searchbox{position:relative}
  .sugglist{border:0.5px solid var(--border-strong);border-radius:var(--radius);margin-top:6px;max-height:220px;overflow:auto}
  .suggitem{padding:10px 12px;font-size:14px;cursor:pointer;border-bottom:0.5px solid var(--border)}
  .suggitem:last-child{border-bottom:none}
  .suggitem:active{background:var(--bg)}
  .tabs{display:flex;gap:6px;margin:12px;overflow-x:auto}
  .tab{padding:8px 14px;border-radius:20px;font-size:13px;white-space:nowrap;border:0.5px solid var(--border-strong);background:#fff}
  .tab.active{background:var(--text);color:#fff;border-color:var(--text)}
  label.field-label{font-size:12px;color:var(--text-sec);display:block;margin:0 0 4px}
  .field{margin-bottom:14px}
  .errmsg{color:var(--danger);font-size:12px;margin-top:4px}

/* ================= STATE ================= */
let state = {

const app = document.getElementById("app");

/* ================= KEYBOARD MOBILE: JAGA TAMPILAN TETAP NYAMAN ================= */
function syncKeyboardOffset(){
  if(!window.visualViewport) return;
  const vv = window.visualViewport;
  const offset = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
  document.documentElement.style.setProperty("--kb-offset", offset + "px");
}
if(window.visualViewport){
  window.visualViewport.addEventListener("resize", syncKeyboardOffset);
  window.visualViewport.addEventListener("scroll", syncKeyboardOffset);
}
document.addEventListener("focusin", (e) => {
  if(e.target.matches("input, textarea, select")){
    setTimeout(() => {
      e.target.scrollIntoView({ block: "center", behavior: "smooth" });
    }, 250);
  }
});

/* ================= UTIL ================= */
function fmtRupiah(n){
  n = Number(n) || 0;
  return "Rp " + n.toLocaleString("id-ID");
}
function todayCode(){
  const d = new Date();
  return d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0");
}
async function generateNoTiket(prefix, table){
  const start = new Date(); start.setHours(0,0,0,0);
  const { count } = await sb.from(table).select("id", { count: "exact", head: true }).gte("created_at", start.toISOString());
  const urut = String((count||0) + 1).padStart(4,"0");
  return prefix + "-" + todayCode() + "-" + urut;
}

/* Popup aman: nutup HANYA kalau mousedown DAN mouseup sama-sama di overlay (bukan di modal) */
function openModal(innerHtml, onMount){
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `<div class="modal">${innerHtml}</div>`;
  let downOnOverlay = false;
  overlay.addEventListener("mousedown", (e)=>{ downOnOverlay = (e.target === overlay); });
  overlay.addEventListener("mouseup", (e)=>{
    if(downOnOverlay && e.target === overlay){ overlay.remove(); }
    downOnOverlay = false;
  });
  document.body.appendChild(overlay);
  if(onMount) onMount(overlay);
  return overlay;
}

async function catatLog(aksi, modul, detail){
  try{ await sb.from("log_aktivitas").insert({ user_id: state.profile.id, aksi, modul, detail: detail || {} }); }
  catch(e){ console.error("Gagal catat log:", e); }
}
async function loadLogAktivitas(){
  const { data } = await sb.from("log_aktivitas").select("*, profiles(nama)").order("created_at", { ascending:false }).limit(50);
  state.logList = data || [];
}

/* ================= AUTH ================= */
async function login(username, password){
  state.error = "";
  let uname = username.trim().toLowerCase();
  if(uname.includes("@")) uname = uname.split("@")[0];
  const email = uname + EMAIL_DOMAIN;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ state.error = "Gagal masuk (" + email + "): " + error.message; render(); return; }
  state.session = data.session;
  await loadProfile();
  await loadMasterData();
  state.view = "permintaan";
  await expireOldPermintaan();
  await loadTiketList();
  await loadPermintaanTerbuka();
  await loadNotaList();
  await loadTerimaList();
  await loadTerimaLuarList();
  await loadKasData();
  if(state.profile.role === "owner") await loadLogAktivitas();
  render();
}
async function loadProfile(){
  const { data } = await sb.from("profiles").select("*").eq("id", state.session.user.id).single();
  state.profile = data;
}
async function logout(){
  await sb.auth.signOut();
  state = { session:null, profile:null, view:"permintaan", kategoriList:[], jenisList:[], supplierList:[], keranjang:[], tiketList:[], loading:false, error:"" };
  render();
}
async function changePassword(newPass){
  const { error } = await sb.auth.updateUser({ password: newPass });
  if(error){ alert("Gagal ganti password: " + error.message); return; }
  await catatLog("ganti_password", "akun", {});
  alert("Password berhasil diganti.");
}

/* ================= MASTER DATA ================= */
async function loadMasterData(){
  const [k, j, s] = await Promise.all([
    sb.from("kategori_barang").select("*").eq("is_active", true).order("nama_kategori"),
    sb.from("jenis_barang").select("*, kategori_barang(nama_kategori)").eq("is_active", true).order("nama_barang"),
    sb.from("supplier").select("*").eq("is_active", true).order("nama_supplier")
  ]);
  state.kategoriList = k.data || [];
  state.jenisList = j.data || [];
  state.supplierList = s.data || [];
}
async function tambahKategori(nama){
  if(!nama.trim()) return;
  await sb.from("kategori_barang").insert({ nama_kategori: nama.trim(), created_by: state.profile.id });
  await catatLog("tambah_kategori", "master_data", { nama_kategori: nama.trim() });
  await loadMasterData(); render();
}
async function tambahJenisBarang(nama, kategoriId, satuan, harga){
  if(!nama.trim() || !kategoriId || !satuan.trim()) return;
  await sb.from("jenis_barang").insert({
    nama_barang: nama.trim(), kategori_id: kategoriId, satuan: satuan.trim(),
    harga_referensi: harga ? Number(harga) : null, created_by: state.profile.id
  });
  await catatLog("tambah_jenis_barang", "master_data", { nama_barang: nama.trim() });
  await loadMasterData(); render();
}
async function tambahSupplier(nama, alamat, namaPenjual, kontak){
  if(!nama.trim()) return;
  await sb.from("supplier").insert({
    nama_supplier: nama.trim(), alamat: alamat.trim() || null,
    nama_penjual: namaPenjual.trim() || null, kontak: kontak.trim() || null,
    created_by: state.profile.id
  });
  await catatLog("tambah_supplier", "master_data", { nama_supplier: nama.trim() });
  await loadMasterData(); render();
}

/* ================= NOTA & PENERIMAAN: LOADER ================= */
async function loadNotaList(){
  const { data, error } = await sb.from("tiket_nota")
    .select("*, supplier(nama_supplier), profiles!purchasing_id(nama), nota_item(*, jenis_barang(nama_barang, satuan))")
    .order("created_at", { ascending: false }).limit(30);
  if(error) console.error("loadNotaList gagal:", error.message);
  state.notaList = data || [];
}
async function expireOldPermintaan(){
  const today = new Date().toISOString().slice(0,10);
  await sb.from("permintaan_item")
    .update({ status: "tidak_disediakan" })
    .eq("tipe", "biasa")
    .in("status", ["pending","sebagian"])
    .lt("tanggal_dibutuhkan", today)
    .eq("is_void", false);
}
async function loadPermintaanTerbuka(){
  const { data } = await sb.from("permintaan_item")
    .select("*, jenis_barang(nama_barang, satuan, harga_referensi), tiket_permintaan(no_tiket, requester_id, profiles(nama))")
    .in("status", ["pending","sebagian"]).eq("is_void", false)
    .order("created_at", { ascending: true });
  state.permintaanTerbuka = data || [];
  const idUnik = [...new Set(state.permintaanTerbuka.map(pi => pi.jenis_barang_id))];
  const supplierMap = await loadLastSupplierPerBarang(idUnik);
  state.permintaanTerbuka.forEach(pi => { pi._lastSupplier = supplierMap[pi.jenis_barang_id] || null; });
}
async function loadTerimaList(){
  const { data } = await sb.from("nota_item")
    .select("*, jenis_barang(nama_barang, satuan), tiket_nota(no_nota, supplier(nama_supplier)), permintaan_item(jenis_barang_id, tiket_permintaan(requester_id))")
    .eq("status_penerimaan", "menunggu");
  state.terimaList = (data || []).filter(ni => ni.permintaan_item?.tiket_permintaan?.requester_id === state.profile.id);
}
async function loadTerimaLuarList(){
  const { data } = await sb.from("nota_item")
    .select("*, jenis_barang(nama_barang, satuan), tiket_nota(no_nota, supplier(nama_supplier))")
    .eq("status_penerimaan", "menunggu")
    .is("permintaan_item_id", null);
  state.terimaLuarList = data || [];
}
async function loadRequesterList(){
  const { data } = await sb.from("profiles").select("id, nama").in("role", ["user","accounting"]).eq("is_active", true).order("nama");
  state.requesterList = data || [];
}

async function loadKasData(){
  const { data: ledger } = await sb.from("kas_ledger").select("saldo_berjalan").order("created_at", { ascending:false }).limit(1);
  state.saldoKas = (ledger && ledger.length) ? Number(ledger[0].saldo_berjalan) : 0;

  const { data: belum } = await sb.from("tiket_nota").select("*, supplier(nama_supplier), nota_item(status_penerimaan)")
    .eq("status_kas","belum_diajukan").eq("is_void", false).order("created_at");
  state.notaBelumDiajukan = belum || [];

  const { data: diajukan } = await sb.from("tiket_nota").select("*, supplier(nama_supplier)")
    .eq("status_kas","diajukan").order("created_at");
  state.notaDiajukan = diajukan || [];

  const { data: disetujui } = await sb.from("tiket_nota").select("*, supplier(nama_supplier)")
    .eq("status_kas","disetujui").order("created_at");
  state.notaDisetujui = disetujui || [];

  const { data: transferMenunggu } = await sb.from("pengajuan_transfer").select("*").eq("status","menunggu").order("created_at");
  for(const pt of (transferMenunggu || [])){
    const { data: notanya } = await sb.from("tiket_nota")
      .select("no_nota, tanggal_belanja, total_nominal, supplier(nama_supplier)")
      .eq("pengajuan_transfer_id", pt.id);
    pt._notaList = notanya || [];
  }
  state.pengajuanTransferMenunggu = transferMenunggu || [];

  const { data: transferSelesai } = await sb.from("pengajuan_transfer").select("*")
    .in("status", ["sudah_transfer","tunda"]).eq("is_void", false)
    .order("created_at", { ascending:false }).limit(20);
  for(const pt of (transferSelesai || [])){
    const { data: notanya } = await sb.from("tiket_nota")
      .select("no_nota, tanggal_belanja, total_nominal, supplier(nama_supplier)")
      .eq("pengajuan_transfer_id", pt.id);
    pt._notaList = notanya || [];
  }
  state.pengajuanTransferSelesai = transferSelesai || [];
}

async function loadLastSupplierPerBarang(jenisBarangIds){
  if(!jenisBarangIds || jenisBarangIds.length === 0) return {};
  const { data } = await sb.from("nota_item")
    .select("jenis_barang_id, created_at, tiket_nota(supplier(nama_supplier))")
    .in("jenis_barang_id", jenisBarangIds)
    .order("created_at", { ascending: false });
  const map = {};
  (data || []).forEach(row => {
    if(!(row.jenis_barang_id in map)){
      map[row.jenis_barang_id] = row.tiket_nota?.supplier?.nama_supplier || null;
    }
  });
  return map;
}

/* ================= PERMINTAAN BARANG ================= */
async function loadTiketList(){
  const { data } = await sb.from("tiket_permintaan")
    .select("*, profiles(nama), permintaan_item(*, jenis_barang(nama_barang, satuan))")
    .order("created_at", { ascending: false }).limit(30);
  state.tiketList = data || [];
}

function tambahKeKeranjang(item){
  state.keranjang.push({
    jenis_barang_id: item.id, nama_barang: item.nama_barang, satuan: item.satuan,
    harga_referensi: item.harga_referensi, jumlah: 1, tipe: "biasa", boleh_diganti: false,
    tanggal_dibutuhkan: new Date().toISOString().slice(0,10)
  });
  render();
}
function hapusDariKeranjang(idx){ state.keranjang.splice(idx,1); render(); }
function ubahQtyKeranjang(idx, delta){
  state.keranjang[idx].jumlah = Math.max(1, state.keranjang[idx].jumlah + delta);
  render();
}
function ubahQtyKeranjangLangsung(idx, val){
  const n = Number(val);
  state.keranjang[idx].jumlah = (n > 0) ? n : state.keranjang[idx].jumlah;
  render();
}
function ubahTanggalKeranjang(idx, val){ state.keranjang[idx].tanggal_dibutuhkan = val; }
function ubahTipeKeranjang(idx, tipe){ state.keranjang[idx].tipe = tipe; render(); }
function ubahGantiKeranjang(idx, val){ state.keranjang[idx].boleh_diganti = val; render(); }

async function submitPermintaan(){
  if(state.keranjang.length === 0){ alert("Tambahkan minimal 1 barang dulu."); return; }
  const no_tiket = await generateNoTiket("TP", "tiket_permintaan");
  const { data: tiket, error } = await sb.from("tiket_permintaan")
    .insert({ no_tiket, requester_id: state.profile.id }).select().single();
  if(error){ alert("Gagal membuat tiket: " + error.message); return; }
  const rows = state.keranjang.map(it => ({
    tiket_permintaan_id: tiket.id, jenis_barang_id: it.jenis_barang_id,
    jumlah_diminta: it.jumlah, tipe: it.tipe, boleh_diganti: it.boleh_diganti,
    tanggal_dibutuhkan: it.tanggal_dibutuhkan
  }));
  const { error: err2 } = await sb.from("permintaan_item").insert(rows);
  if(err2){ alert("Gagal menyimpan barang: " + err2.message); return; }
  state.keranjang = [];
  await loadTiketList();
  await catatLog("buat_permintaan", "permintaan", { no_tiket, jumlah_item: rows.length });
  alert("Permintaan " + no_tiket + " berhasil dibuat.");
  render();
}

/* ================= SEARCH BARANG ================= */
function searchJenisBarang(keyword){
  const kw = keyword.trim().toLowerCase();
  if(!kw) return [];
  return state.jenisList.filter(j => j.nama_barang.toLowerCase().includes(kw)).slice(0, 8);
}

/* ================= NOTA: KERANJANG & AKSI ================= */
function tambahKeNotaKeranjang(pi){
  if(state.notaKeranjang.some(it => it.permintaan_item_id === pi.id)) return;
  state.notaKeranjang.push({
    permintaan_item_id: pi.id,
    jenis_barang_id_asli: pi.jenis_barang_id,
    jenis_barang_id: pi.jenis_barang_id,
    nama_barang: pi.jenis_barang.nama_barang,
    satuan: pi.jenis_barang.satuan,
    jumlah: Math.max(1, (pi.jumlah_diminta - pi.jumlah_terpenuhi)),
    harga: pi.jenis_barang.harga_referensi || 0,
    is_substitusi: false
  });
  render();
}
function tambahBarangLuarPermintaan(item){
  state.notaKeranjang.push({
    permintaan_item_id: null,
    jenis_barang_id_asli: item.id,
    jenis_barang_id: item.id,
    nama_barang: item.nama_barang,
    satuan: item.satuan,
    jumlah: 1,
    harga: item.harga_referensi || 0,
    is_substitusi: false
  });
  render();
}
function hapusDariNotaKeranjang(idx){ state.notaKeranjang.splice(idx,1); render(); }
function ubahQtyNotaKeranjang(idx, delta){
  state.notaKeranjang[idx].jumlah = Math.max(1, state.notaKeranjang[idx].jumlah + delta);
  render();
}
function ubahQtyNotaLangsung(idx, val){
  const n = Number(val);
  state.notaKeranjang[idx].jumlah = (n > 0) ? n : state.notaKeranjang[idx].jumlah;
  render();
}
function ubahHargaNotaKeranjang(idx, val){
  state.notaKeranjang[idx].harga = Number(val) || 0;
}

function openGantiBarangModal(idx){
  openModal(`
    <p style="font-weight:600;margin:0 0 12px">Ganti barang yang dibeli</p>
    <input id="gbSearch" placeholder="Cari barang pengganti...">
    <div id="gbResults" class="sugglist" style="margin-top:8px"></div>
    <div id="gbTambahWrap"></div>
  `, (overlay) => {
    const inp = overlay.querySelector("#gbSearch");
    const box = overlay.querySelector("#gbResults");
    const tambahWrap = overlay.querySelector("#gbTambahWrap");
    function refresh(){
      const res = searchJenisBarang(inp.value);
      box.innerHTML = res.map(r => `<div class="suggitem" data-id="${r.id}">${r.nama_barang} <span class="muted">· ${r.satuan}</span></div>`).join("");

async function submitNota(){
  if(!state.notaSupplierId){ alert("Pilih supplier dulu."); return; }
  if(state.notaKeranjang.length === 0){ alert("Tambahkan minimal 1 barang dulu."); return; }
  const no_nota = await generateNoTiket("TN", "tiket_nota");
  const totalNominal = state.notaKeranjang.reduce((s, it) => s + it.jumlah * it.harga, 0);
  const { data: nota, error } = await sb.from("tiket_nota").insert({
    no_nota, purchasing_id: state.profile.id, supplier_id: state.notaSupplierId,
    tanggal_belanja: new Date().toISOString().slice(0,10), total_nominal: totalNominal
  }).select().single();
  if(error){ alert("Gagal membuat nota: " + error.message); return; }

  const { data: ledgerTerakhir } = await sb.from("kas_ledger").select("saldo_berjalan").order("created_at",{ascending:false}).limit(1);
  const saldoLama = (ledgerTerakhir && ledgerTerakhir.length) ? Number(ledgerTerakhir[0].saldo_berjalan) : 0;
  const { error: eLedger } = await sb.from("kas_ledger").insert({
    jenis:"keluar", jumlah: totalNominal, saldo_berjalan: saldoLama - totalNominal,
    ref_tabel: "tiket_nota", ref_id: nota.id, keterangan: "Belanja nota " + no_nota
  });
  if(eLedger){ alert("Nota tersimpan tapi GAGAL mencatat kas keluar: " + eLedger.message + " — hubungi admin, saldo kas tidak akurat sampai ini diperbaiki."); }

  for(const it of state.notaKeranjang){
    const luarPermintaan = !it.permintaan_item_id;
    const { error: eItem } = await sb.from("nota_item").insert({
      tiket_nota_id: nota.id, permintaan_item_id: it.permintaan_item_id,
      jenis_barang_id: it.jenis_barang_id, is_substitusi: it.is_substitusi,
      jumlah_dibeli: it.jumlah, harga_satuan: it.harga,
      status_penerimaan: "menunggu"
    });
    if(eItem){ alert("Gagal simpan baris nota: " + eItem.message); continue; }
    if(luarPermintaan) continue;

    const { data: pi } = await sb.from("permintaan_item").select("*").eq("id", it.permintaan_item_id).single();
    if(pi){
      const terpenuhiBaru = Number(pi.jumlah_terpenuhi) + Number(it.jumlah);
      const statusBaru = terpenuhiBaru >= pi.jumlah_diminta ? "selesai" : "sebagian";
      await sb.from("permintaan_item").update({ jumlah_terpenuhi: terpenuhiBaru, status: statusBaru }).eq("id", pi.id);
    }
  }
  state.notaKeranjang = []; state.notaSupplierId = null; state.notaSupplierSearch = "";
  await loadPermintaanTerbuka(); await loadNotaList(); await loadTiketList(); await loadKasData();
  await catatLog("buat_nota", "nota", { no_nota, total_nominal: totalNominal });
  alert("Nota " + no_nota + " berhasil disimpan.");
  render();
}

async function keputusanTransfer(pengajuanId, keputusan, nominalAktual){
  const pengajuan = state.pengajuanTransferMenunggu.find(p => p.id === pengajuanId);
  if(keputusan === "sudah_transfer"){
    const jumlahRiil = (nominalAktual !== undefined && nominalAktual !== null && nominalAktual !== "")
      ? Number(nominalAktual) : Number(pengajuan.total_nominal);
    if(!jumlahRiil || jumlahRiil <= 0){ alert("Nominal transfer harus lebih dari 0."); return; }
    const { data: ledgerTerakhir } = await sb.from("kas_ledger").select("saldo_berjalan").order("created_at",{ascending:false}).limit(1);
    const saldoLama = (ledgerTerakhir && ledgerTerakhir.length) ? Number(ledgerTerakhir[0].saldo_berjalan) : 0;
    const { error: eLedger } = await sb.from("kas_ledger").insert({
      jenis: "masuk", jumlah: jumlahRiil, saldo_berjalan: saldoLama + jumlahRiil,
      ref_tabel: "pengajuan_transfer", ref_id: pengajuanId,
      keterangan: "Transfer " + pengajuan.no_pengajuan_transfer +
        (jumlahRiil !== Number(pengajuan.total_nominal) ? " (nominal aktual disesuaikan dari " + fmtRupiah(pengajuan.total_nominal) + ")" : "")
    });
    if(eLedger){ alert("GAGAL mencatat kas masuk: " + eLedger.message); return; }

      status: "sudah_transfer", keputusan_oleh: state.profile.id, keputusan_at: new Date().toISOString(),
      jumlah_transfer_aktual: jumlahRiil
    }).eq("id", pengajuanId);
    await sb.from("tiket_nota").update({ status_kas: "selesai" }).eq("pengajuan_transfer_id", pengajuanId);
    await catatLog("transfer_selesai", "kas", { pengajuan_id: pengajuanId, total_dihitung: pengajuan.total_nominal, jumlah_aktual: jumlahRiil });
  } else {
    await sb.from("pengajuan_transfer").update({

  }
  await loadKasData();
  render();
}

async function voidNota(notaId){
  openVoidModal("Void nota", async (reason) => {
    const { data: nota } = await sb.from("tiket_nota").select("*, nota_item(*)").eq("id", notaId).single();
    if(!nota || nota.is_void) return;
    if(nota.status_kas !== "belum_diajukan"){
      alert("Nota ini statusnya '" + nota.status_kas.replace(/_/g," ") + "'. Void hanya bisa dilakukan saat status belum_diajukan — tolak/batalkan approval/void transfer dulu sesuai urutannya.");
      return;
    }

    const { data: origLedger } = await sb.from("kas_ledger").select("*")
      .eq("ref_tabel","tiket_nota").eq("ref_id",notaId).eq("jenis","keluar").eq("is_void",false).maybeSingle();
    if(origLedger){
      const { data: ledgerTerakhir } = await sb.from("kas_ledger").select("saldo_berjalan").order("created_at",{ascending:false}).limit(1);
      const saldoLama = (ledgerTerakhir && ledgerTerakhir.length) ? Number(ledgerTerakhir[0].saldo_berjalan) : 0;
      await sb.from("kas_ledger").insert({
        jenis:"masuk", jumlah: origLedger.jumlah, saldo_berjalan: saldoLama + Number(origLedger.jumlah),
        ref_tabel:"tiket_nota", ref_id:notaId, keterangan:"Reversal void nota " + nota.no_nota, void_ref_id: origLedger.id
      });
      await sb.from("kas_ledger").update({ is_void:true }).eq("id", origLedger.id);
    }

    for(const ni of (nota.nota_item || [])){
      if(!ni.permintaan_item_id) continue;
      const { data: pi } = await sb.from("permintaan_item").select("*").eq("id", ni.permintaan_item_id).single();
      if(pi){
        const terpenuhiBaru = Math.max(0, Number(pi.jumlah_terpenuhi) - Number(ni.jumlah_dibeli));
        const statusBaru = terpenuhiBaru <= 0 ? "pending" : (terpenuhiBaru >= pi.jumlah_diminta ? "selesai" : "sebagian");
        await sb.from("permintaan_item").update({ jumlah_terpenuhi: terpenuhiBaru, status: statusBaru }).eq("id", pi.id);
      }
    }

    await sb.from("tiket_nota").update({
      is_void:true, void_reason:reason, void_by: state.profile.id, void_at: new Date().toISOString()
    }).eq("id", notaId);

    await catatLog("void_nota", "nota", { nota_id: notaId, no_nota: nota.no_nota, alasan: reason });
    await loadNotaList(); await loadKasData(); await loadPermintaanTerbuka(); await loadTiketList();
    alert("Nota " + nota.no_nota + " berhasil di-void.");
    render();
  });
}

async function loadLaporan(){
  if(!state.laporanFrom || !state.laporanTo){
    const now = new Date();
    const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0,10);
    state.laporanFrom = firstDay;
    state.laporanTo = now.toISOString().slice(0,10);
  }
  const { data: notaList } = await sb.from("tiket_nota")
    .select("id, tanggal_belanja, supplier_id, supplier(nama_supplier), pengajuan_transfer(status, keputusan_at)")
    .eq("is_void", false)
    .gte("tanggal_belanja", state.laporanFrom)
    .lte("tanggal_belanja", state.laporanTo);
  const notaIds = (notaList || []).map(n => n.id);
  const notaMap = {};
  (notaList || []).forEach(n => { notaMap[n.id] = n; });

  if(notaIds.length === 0){ state.laporanRows = []; return; }

  const { data: items } = await sb.from("nota_item")
    .select("jumlah_dibeli, harga_satuan, subtotal, tiket_nota_id, jenis_barang(nama_barang, satuan, kategori_id, kategori_barang(nama_kategori))")
    .in("tiket_nota_id", notaIds);

  state.laporanRows = (items || []).map(it => {
    const nota = notaMap[it.tiket_nota_id];
    const transferSelesai = nota?.pengajuan_transfer?.status === "sudah_transfer";
    return {
      tanggal: nota?.tanggal_belanja || "",
      nama_barang: it.jenis_barang?.nama_barang || "-",
      satuan: it.jenis_barang?.satuan || "",
      kategori: it.jenis_barang?.kategori_barang?.nama_kategori || "-",
      kategori_id: it.jenis_barang?.kategori_id || null,
      supplier: nota?.supplier?.nama_supplier || "-",
      supplier_id: nota?.supplier_id || null,
      jumlah: Number(it.jumlah_dibeli) || 0,
      harga_satuan: Number(it.harga_satuan) || 0,
      subtotal: Number(it.subtotal) || 0,
      tanggal_diganti: transferSelesai ? (nota.pengajuan_transfer.keputusan_at || "").slice(0,10) : ""
    };
  });
}

function groupSum(rows, keyFn, valFn){
  const map = new Map();
  for(const r of rows){
    const k = keyFn(r);
    map.set(k, (map.get(k) || 0) + valFn(r));
  }
  return Array.from(map.entries()).sort((a,b) => b[1] - a[1]);
}

function filterLaporanNota(){
  return state.laporanRows.filter(r =>
    (!state.laporanNotaKategori || r.kategori_id === state.laporanNotaKategori) &&
    (!state.laporanNotaSupplier || r.supplier === state.laporanNotaSupplier)
  );
}
function exportLaporanNotaCsv(){
  const rows = filterLaporanNota();
  if(rows.length === 0){ alert("Tidak ada data untuk diekspor."); return; }
  const header = ["Tanggal","Supplier","Kategori","Barang","Jumlah","Satuan","Harga Satuan","Harga Total","Tanggal Diganti"];
  const escapeCsv = (v) => `"${String(v ?? "").replace(/"/g,'""')}"`;
  const lines = [header.map(escapeCsv).join(",")];
  rows.forEach(r => {
    lines.push([
      r.tanggal, r.supplier, r.kategori, r.nama_barang, r.jumlah, r.satuan,
      r.harga_satuan, r.subtotal, r.tanggal_diganti || "Belum diganti"
    ].map(escapeCsv).join(","));
  });
  const csv = "\uFEFF" + lines.join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "riwayat-nota-" + state.laporanFrom + "_sd_" + state.laporanTo + ".csv";
  a.click();
  URL.revokeObjectURL(url);
}
function setPresetLaporan(preset){
  const now = new Date();
  if(preset === "hari"){
    const d = now.toISOString().slice(0,10);
    state.laporanFrom = d; state.laporanTo = d;
  } else if(preset === "minggu"){
    const hari = now.getDay() === 0 ? 7 : now.getDay();
    const senin = new Date(now); senin.setDate(now.getDate() - hari + 1);
    state.laporanFrom = senin.toISOString().slice(0,10);
    state.laporanTo = now.toISOString().slice(0,10);
  } else {
    state.laporanFrom = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0,10);
    state.laporanTo = now.toISOString().slice(0,10);
  }
  loadLaporan().then(render);
}

  document.querySelectorAll("[data-ganti]").forEach(el => el.onchange = () => ubahGantiKeranjang(Number(el.dataset.ganti), el.checked));
  document.querySelectorAll("[data-tanggal]").forEach(el => el.onchange = () => ubahTanggalKeranjang(Number(el.dataset.tanggal), el.value));
  const btnSubmit = document.getElementById("btnSubmitPermintaan");
  if(btnSubmit) btnSubmit.onclick = submitPermintaan;
  document.querySelectorAll("[data-terima]").forEach(el => el.onclick = () => terimaBarangItem(el.dataset.terima));
  document.querySelectorAll("[data-terimaluar]").forEach(el => el.onclick = () => terimaBarangItem(el.dataset.terimaluar));
  document.querySelectorAll("[data-voidpi]").forEach(el => el.onclick = () => voidPermintaanItem(el.dataset.voidpi));
  const btnTambahCepat = document.getElementById("btnTambahBarangCepat");
  if(btnTambahCepat) btnTambahCepat.onclick = () => openTambahBarangBaruModal(searchVal, (item) => {
    window.__searchVal = "";
    tambahKeKeranjang(item);
  });
}

/* ================= RENDER: NOTA ================= */
function renderNota(){
  const isPurchasing = ["purchasing","owner"].includes(state.profile.role);
  const supKw = state.notaSupplierSearch.trim().toLowerCase();
  const supResults = (supKw && !state.notaSupplierId) ? state.supplierList.filter(s => s.nama_supplier.toLowerCase().includes(supKw)).slice(0,6) : [];
  const luarResults = searchJenisBarang(window.__notaLuarSearch || "");

  const grupToko = {};
  state.permintaanTerbuka.forEach(pi => {
    const key = pi._lastSupplier || "Belum ada riwayat pembelian";
    if(!grupToko[key]) grupToko[key] = [];
    grupToko[key].push(pi);
  });
  const namaGrupToko = Object.keys(grupToko).sort((a,b) => {
    if(a === "Belum ada riwayat pembelian") return 1;
    if(b === "Belum ada riwayat pembelian") return -1;
    return a.localeCompare(b);
  });

  const formHtml = isPurchasing ? `
    <div class="card">
      <p style="font-weight:600;margin:0 0 12px">Catat nota belanja</p>
      <label class="field-label">Supplier</label>
      <input id="supSearch" placeholder="Cari supplier..." value="${state.notaSupplierSearch}">
      ${supResults.length ? `<div class="sugglist" id="supBox">
        ${supResults.map(s => `<div class="suggitem" data-id="${s.id}">${s.nama_supplier}</div>`).join("")}
      </div>` : ""}
      ${supKw && !state.notaSupplierId && supResults.length===0 ? `<button style="width:100%;margin-top:8px;font-size:13px" id="btnTambahSupplierCepat">+ Tambah "${state.notaSupplierSearch}" sebagai supplier baru</button>` : ""}

      <p style="font-weight:600;margin:16px 0 8px;font-size:14px">Pilih dari permintaan menunggu</p>
      <p class="muted" style="margin:0 0 8px;font-size:12px">Dikelompokkan berdasarkan toko terakhir kali barang itu dibeli, supaya tidak ada yang tertinggal saat belanja di satu tempat.</p>
      <div class="sugglist" style="max-height:280px">
        ${state.permintaanTerbuka.length === 0 ? `<p class="muted" style="padding:10px">Tidak ada permintaan terbuka.</p>` :
          namaGrupToko.map(toko => `
            <div style="padding:8px 12px;background:var(--bg);font-size:12px;font-weight:600;color:var(--text-sec)">🏪 ${toko}</div>
            ${grupToko[toko].map(pi => `
            <div class="between" style="padding:10px 12px;border-bottom:0.5px solid var(--border)">
              <span data-pilih="${pi.id}" style="cursor:pointer">${pi.jenis_barang?.nama_barang} · sisa ${(pi.jumlah_diminta - pi.jumlah_terpenuhi)} ${pi.jenis_barang?.satuan}
                <span class="badge badge-${pi.tipe}">${pi.tipe}</span>
              </span>
              ${pi.tipe === "wajib" ? `<button style="padding:3px 6px;font-size:11px" data-hilang="${pi.id}">Tandai hilang</button>` : `<span class="muted" style="font-size:11px">${pi.tiket_permintaan?.profiles?.nama || ''}</span>`}
            </div>
          `).join("")}
        `).join("")}
      </div>

      <p style="font-weight:600;margin:16px 0 8px;font-size:14px">Tambah barang di luar permintaan</p>
      <p class="muted" style="margin:0 0 8px;font-size:12px">Untuk barang yang tidak ada permintaannya (misal beli tambahan/pengganti yang tidak sesuai jumlah aslinya).</p>
      <input id="luarSearch" placeholder="Cari barang..." value="${window.__notaLuarSearch || ''}">
      ${luarResults.length ? `<div class="sugglist" id="luarBox">
        ${luarResults.map(r => `<div class="suggitem" data-luarid="${r.id}">${r.nama_barang} <span class="muted">· ${r.satuan}</span></div>`).join("")}
      </div>` : ""}
      ${window.__notaLuarSearch && luarResults.length===0 ? `<button style="width:100%;margin-top:8px;font-size:13px" id="btnTambahBarangLuarCepat">+ Tambah "${window.__notaLuarSearch}" sebagai barang baru</button>` : ""}

      ${state.notaKeranjang.length ? `
      <p style="font-weight:600;margin:16px 0 8px;font-size:14px">Barang di nota ini</p>
      ${state.notaKeranjang.map((it, idx) => `
        <div style="border-bottom:0.5px solid var(--border);padding:10px 0">
          <div class="between">
            <span style="font-size:14px">${it.nama_barang} ${it.is_substitusi ? '<span class="badge badge-pending">pengganti</span>' : ''} ${!it.permintaan_item_id ? '<span class="badge badge-luar">di luar permintaan</span>' : ''}</span>
            <button style="padding:4px 8px;font-size:12px" data-hapusnota="${idx}">Hapus</button>
          </div>
          <button style="font-size:12px;margin-top:6px;padding:4px 8px" data-ganti="${idx}">Ganti barang</button>
          <div class="row" style="margin-top:8px;gap:8px">
            <div class="stepper" style="flex:1">
              <button data-qtynota="${idx}" data-delta="-1">−</button>
              <input data-qtynotainput="${idx}" value="${it.jumlah}" style="width:64px;text-align:center;flex:none">
              <span class="muted" style="font-size:12px">${it.satuan}</span>
              <button data-qtynota="${idx}" data-delta="1">+</button>
            </div>
            <input style="flex:1" data-harga="${idx}" value="${it.harga}" placeholder="Harga satuan">
          </div>
        </div>
      `).join("")}
      <button class="primary" style="width:100%;margin-top:12px" id="btnSubmitNota">Simpan nota (${state.notaKeranjang.length} barang)</button>
      ` : ""}
    </div>` : "";

  const historyHtml = `
    <div class="card">
      <p style="font-weight:600;margin:0 0 12px">Riwayat nota</p>
      ${state.notaList.length === 0 ? `<p class="muted">Belum ada nota.</p>` : state.notaList.map(n => `
        <div style="border-bottom:0.5px solid var(--border);padding:10px 0">
          <div class="between">
            <span style="font-size:13px;font-weight:600">${n.no_nota} · ${n.supplier?.nama_supplier}</span>
            <span class="badge badge-pending">${n.is_void ? 'void' : n.status_kas.replace(/_/g,' ')}</span>
          </div>
          <div class="between" style="margin-top:4px">
            <span class="muted" style="font-size:12px">${n.tanggal_belanja}</span>
            <span style="font-size:13px;font-weight:600">${fmtRupiah(n.total_nominal)}</span>
          </div>
          ${(n.nota_item||[]).map(ni => `
            <div style="margin-top:4px;font-size:12px" class="muted">
              <span>${ni.jenis_barang?.nama_barang} · ${ni.jumlah_dibeli} ${ni.jenis_barang?.satuan}</span>
              ${ni.is_substitusi ? '<span class="badge badge-pending" style="margin-left:6px">pengganti</span>' : ''}
              ${!ni.permintaan_item_id ? '<span class="badge badge-luar" style="margin-left:6px">di luar permintaan</span>' : ''}
            </div>
          `).join("")}
          ${state.profile.role==='owner' && !n.is_void ? (
            n.status_kas === 'belum_diajukan'
              ? `<button style="padding:3px 8px;font-size:11px;margin-top:6px" data-voidnota="${n.id}">Void nota</button>`
              : `<p class="muted" style="font-size:11px;margin:6px 0 0">Void hanya bisa saat status belum_diajukan — tolak/batalkan approval/void transfer dulu sesuai urutannya.</p>`
          ) : ""}
        </div>
      `).join("")}
    </div>`;

  renderShell(formHtml + historyHtml);

  if(isPurchasing){
    const supInput = document.getElementById("supSearch");
    if(supInput){
      supInput.oninput = () => { state.notaSupplierId = null; state.notaSupplierSearch = supInput.value; render(); };
      if(!state.notaSupplierId){ supInput.focus(); supInput.setSelectionRange(supInput.value.length, supInput.value.length); }
    }
    document.querySelectorAll("#supBox .suggitem").forEach(el => {
      el.onclick = () => pilihSupplierNota(state.supplierList.find(s => s.id === el.dataset.id));
    });
    const btnTambahSupplierCepat = document.getElementById("btnTambahSupplierCepat");
    if(btnTambahSupplierCepat) btnTambahSupplierCepat.onclick = () => openTambahSupplierBaruModal(state.notaSupplierSearch, (sup) => {
      pilihSupplierNota(sup);
    });
    document.querySelectorAll("[data-pilih]").forEach(el => {
      el.onclick = () => tambahKeNotaKeranjang(state.permintaanTerbuka.find(p => p.id === el.dataset.pilih));
    });
    document.querySelectorAll("[data-hilang]").forEach(el => el.onclick = () => tandaiHilang(el.dataset.hilang));
    const luarInput = document.getElementById("luarSearch");
    if(luarInput){
      luarInput.oninput = () => { window.__notaLuarSearch = luarInput.value; render(); };
      if(window.__notaLuarSearch){ luarInput.focus(); luarInput.setSelectionRange(luarInput.value.length, luarInput.value.length); }
    }
    document.querySelectorAll("[data-luarid]").forEach(el => {
      el.onclick = () => {
        const item = state.jenisList.find(j => j.id === el.dataset.luarid);
        window.__notaLuarSearch = "";
        tambahBarangLuarPermintaan(item);
      };
    });
    const btnTambahLuarCepat = document.getElementById("btnTambahBarangLuarCepat");
    if(btnTambahLuarCepat) btnTambahLuarCepat.onclick = () => openTambahBarangBaruModal(window.__notaLuarSearch, (item) => {
      window.__notaLuarSearch = "";
      tambahBarangLuarPermintaan(item);
    });
    document.querySelectorAll("[data-hapusnota]").forEach(el => el.onclick = () => hapusDariNotaKeranjang(Number(el.dataset.hapusnota)));
    document.querySelectorAll("[data-qtynota]").forEach(el => el.onclick = () => ubahQtyNotaKeranjang(Number(el.dataset.qtynota), Number(el.dataset.delta)));
    document.querySelectorAll("[data-qtynotainput]").forEach(el => el.onchange = () => ubahQtyNotaLangsung(Number(el.dataset.qtynotainput), el.value));
    document.querySelectorAll("[data-harga]").forEach(el => el.onchange = () => ubahHargaNotaKeranjang(Number(el.dataset.harga), el.value));
    document.querySelectorAll("[data-ganti]").forEach(el => el.onclick = () => openGantiBarangModal(Number(el.dataset.ganti)));
    const btnSubmitNota = document.getElementById("btnSubmitNota");
    if(btnSubmitNota) btnSubmitNota.onclick = submitNota;
  }
  document.querySelectorAll("[data-voidnota]").forEach(el => el.onclick = () => voidNota(el.dataset.voidnota));
}

/* ================= RENDER: MASTER DATA ================= */

  const tab = window.__masterTab || "kategori";
  const isOwner = state.profile.role === "owner";
  let body = "";
  if(tab === "kategori"){
    body = `
      <div class="field"><input id="mNama" placeholder="Nama kategori baru"></div>
      <button class="primary" style="width:100%" id="btnAddKategori">Tambah kategori</button>
      <div style="margin-top:16px">
        ${state.kategoriList.map(k => `<div class="between" style="padding:8px 0;border-bottom:0.5px solid var(--border)">
          <span>${k.nama_kategori}</span>
          ${isOwner ? `<button style="padding:3px 8px;font-size:11px" data-editkat="${k.id}">Edit</button>` : ""}
        </div>`).join("")}

    body = `

      <div class="field"><label class="field-label">Kategori</label>
        <select id="mKategori">${state.kategoriList.map(k=>`<option value="${k.id}">${k.nama_kategori}</option>`).join("")}</select>
      </div>
      <div class="row" style="gap:8px">
        <div class="field" style="flex:1"><label class="field-label">Satuan</label><input id="mSatuan" placeholder="pcs/kg/liter"></div>

      </div>
      <button class="primary" style="width:100%" id="btnAddJenis">Tambah barang</button>

        ${state.jenisList.map(j => `<div style="padding:8px 0;border-bottom:0.5px solid var(--border)">
          <div class="between"><span>${j.nama_barang}</span><span class="muted">${j.satuan}</span></div>
          <div class="between">
            <span class="muted" style="font-size:12px">${j.kategori_barang?.nama_kategori || ''}</span>
            ${isOwner ? `<button style="padding:3px 8px;font-size:11px" data-editjenis="${j.id}">Edit</button>` : ""}
          </div>
        </div>`).join("")}
      </div>`;
  } else {
    body = `
      <div class="field"><label class="field-label">Nama toko/supplier</label><input id="mNamaSup"></div>
      <div class="field"><label class="field-label">Alamat (opsional)</label><input id="mAlamat"></div>
      <div class="field"><label class="field-label">Nama penjual (opsional)</label><input id="mPenjual"></div>
      <div class="field"><label class="field-label">Kontak (opsional)</label><input id="mKontak"></div>
      <button class="primary" style="width:100%" id="btnAddSupplier">Tambah supplier</button>
      <div style="margin-top:16px">
        ${state.supplierList.map(s => `<div style="padding:8px 0;border-bottom:0.5px solid var(--border)">
          <div class="between">
            <span>${s.nama_supplier}</span>
            ${isOwner ? `<button style="padding:3px 8px;font-size:11px" data-editsup="${s.id}">Edit</button>` : ""}
          </div>
          ${s.alamat ? `<span class="muted" style="font-size:12px;display:block">${s.alamat}</span>` : ""}
          ${s.nama_penjual ? `<span class="muted" style="font-size:12px;display:block">Penjual: ${s.nama_penjual}</span>` : ""}
        </div>`).join("")}
      </div>`;
  }
  const html = `
    <div class="tabs">
      <button class="tab ${tab==='kategori'?'active':''}" data-mtab="kategori">Kategori</button>
      <button class="tab ${tab==='jenis'?'active':''}" data-mtab="jenis">Jenis barang</button>
      <button class="tab ${tab==='supplier'?'active':''}" data-mtab="supplier">Supplier</button>
    </div>
    <div class="card">
      ${!isOwner ? `<p class="muted" style="margin:0 0 12px">Anda bisa menambah data baru. Ubah/hapus hanya bisa dilakukan Owner.</p>` : ""}
      ${body}
    </div>`;
  renderShell(html);

  document.querySelectorAll("[data-mtab]").forEach(el => el.onclick = () => { window.__masterTab = el.dataset.mtab; render(); });
  const btnK = document.getElementById("btnAddKategori");
  if(btnK) btnK.onclick = () => tambahKategori(document.getElementById("mNama").value);

}

/* ================= RENDER: KAS ================= */
function renderKas(){
  const role = state.profile.role;

  if(role === "purchasing" || role === "owner"){
    html += `
    <div class="card">
      <p style="font-weight:600;margin:0 0 4px">Saldo kas</p>
      <p style="font-size:24px;font-weight:600;margin:0 0 8px;${state.saldoKas<0?'color:var(--danger)':''}">${fmtRupiah(state.saldoKas)}</p>
      ${state.saldoKas<0 ? '<p class="muted" style="color:var(--danger)">Saldo minus — purchasing sedang menombok sementara.</p>' : ''}
    </div>`;
  }

  if(role === "owner"){
    html += `
    <div class="card">
      <p style="font-weight:600;margin:0 0 4px">Setoran / penyesuaian kas manual</p>
      <p class="muted" style="margin:0 0 12px">Dipakai untuk mengatur saldo awal atau koreksi manual di luar alur normal. Khusus Owner.</p>
      <div class="row" style="gap:8px;margin-bottom:10px">
        <button class="tab ${(window.__kasJenis||'masuk')==='masuk'?'active':''}" data-kasjenis="masuk">Masuk (tambah)</button>

    const itemDiterima = n => (n.nota_item||[]).filter(ni => ni.status_penerimaan === "diterima").length;
    const siapDiajukan = n => totalItemBelum(n) > 0 && itemDiterima(n) === totalItemBelum(n);
    html += `
    <div class="card">
      <p style="font-weight:600;margin:0 0 4px">Ajukan top-up</p>
      <p class="muted" style="margin:0 0 12px">Hanya nota yang semua barangnya sudah dikonfirmasi diterima yang bisa diajukan.</p>
      ${state.notaBelumDiajukan.length===0 ? '<p class="muted">Tidak ada nota yang siap diajukan.</p>' :
        state.notaBelumDiajukan.map(n => siapDiajukan(n) ? `
        <label class="row" style="padding:8px 0;border-bottom:0.5px solid var(--border)">
          <input type="checkbox" style="width:auto" data-topup="${n.id}" ${state.topupPilih.includes(n.id)?'checked':''}>
          <span style="flex:1;font-size:13px">${n.no_nota} · ${n.supplier?.nama_supplier}</span>
          <span style="font-size:13px;font-weight:600">${fmtRupiah(n.total_nominal)}</span>
        </label>` : `
        <div class="row" style="padding:8px 0;border-bottom:0.5px solid var(--border);opacity:0.6">
          <span style="flex:1;font-size:13px">${n.no_nota} · ${n.supplier?.nama_supplier}</span>
          <span class="badge badge-pending">${itemDiterima(n)}/${totalItemBelum(n)} diterima</span>
        </div>`).join("")}
      ${state.notaBelumDiajukan.some(siapDiajukan) ? `<button class="primary" style="width:100%;margin-top:12px" id="btnSubmitTopup">Ajukan top-up (${state.topupPilih.length} nota)</button>` : ""}
    </div>`;
  }

  if(["accounting","manager","owner"].includes(role)){
    html += `
    <div class="card">
      <p style="font-weight:600;margin:0 0 12px">Approval top-up (per nota)</p>
      ${state.notaDiajukan.length===0 ? '<p class="muted">Tidak ada nota menunggu approval.</p>' :
        state.notaDiajukan.map(n => `
        <div style="border-bottom:0.5px solid var(--border);padding:10px 0">
          <div class="between">
            <span style="font-size:13px">${n.no_nota} · ${n.supplier?.nama_supplier}</span>
            <span style="font-size:13px;font-weight:600">${fmtRupiah(n.total_nominal)}</span>
          </div>
          <div class="row" style="margin-top:8px;gap:8px">
            <button class="primary" style="flex:1" data-approve="${n.id}">Setujui</button>
            <button class="danger" style="flex:1" data-reject="${n.id}">Tolak</button>
          </div>
        </div>`).join("")}
    </div>

    <div class="card">
      <p style="font-weight:600;margin:0 0 12px">Buat pengajuan transfer</p>
      ${state.notaDisetujui.length===0 ? '<p class="muted">Belum ada nota siap ditransfer.</p>' :
        state.notaDisetujui.map(n => `
        <div style="padding:8px 0;border-bottom:0.5px solid var(--border)">
          <label class="row">
            <input type="checkbox" style="width:auto" data-transfer="${n.id}" ${state.transferPilih.includes(n.id)?'checked':''}>
            <span style="flex:1;font-size:13px">${n.no_nota} · ${n.supplier?.nama_supplier}</span>
            <span style="font-size:13px;font-weight:600">${fmtRupiah(n.total_nominal)}</span>
          </label>
          ${role==='owner' ? `<button style="font-size:11px;padding:3px 8px;margin-top:4px" data-batalapproval="${n.id}">Batalkan approval (untuk void)</button>` : ""}
        </div>`).join("")}
      ${state.notaDisetujui.length ? `<button class="primary" style="width:100%;margin-top:12px" id="btnSubmitTransfer">Buat pengajuan transfer (${state.transferPilih.length} nota)</button>` : ""}
    </div>`;
  }

  if(["owner","accounting"].includes(role)){
    html += `
    <div class="card">
      <p style="font-weight:600;margin:0 0 12px">Pengajuan transfer menunggu keputusan</p>
      ${state.pengajuanTransferMenunggu.length===0 ? '<p class="muted">Tidak ada pengajuan menunggu.</p>' :
        state.pengajuanTransferMenunggu.map(p => `
        <div style="border-bottom:0.5px solid var(--border);padding:12px 0">
          <p style="font-weight:600;font-size:13px;margin:0 0 6px">${p.no_pengajuan_transfer}</p>
          ${p._notaList.map(n => `<div class="between"><span class="muted" style="font-size:12px">${n.tanggal_belanja} · ${n.supplier?.nama_supplier}</span><span style="font-size:12px">${fmtRupiah(n.total_nominal)}</span></div>`).join("")}
          <div class="between" style="margin-top:6px;font-weight:600"><span>Total</span><span>${fmtRupiah(p.total_nominal)}</span></div>
          <div class="row" style="margin-top:8px;gap:6px">
            <button style="flex:1;font-size:12px" data-wa="${p.id}">Salin WA</button>
            <button style="flex:1;font-size:12px" data-print="${p.id}">Cetak</button>
          </div>
          <div class="row" style="margin-top:8px;gap:8px">
            <button class="primary" style="flex:1" data-sudahtransfer="${p.id}">Sudah transfer</button>
            <button style="flex:1" data-tunda="${p.id}">Tunda</button>
          </div>
          ${role === "owner" ? `<button class="danger" style="width:100%;margin-top:8px;font-size:12px" data-voidtransfer="${p.id}">Void pengajuan ini</button>` : ""}
        </div>`).join("")}
    </div>

    <div class="card">
      <p style="font-weight:600;margin:0 0 12px">Riwayat keputusan transfer</p>
      ${state.pengajuanTransferSelesai.length===0 ? '<p class="muted">Belum ada.</p>' :
        state.pengajuanTransferSelesai.map(p => `
        <div style="border-bottom:0.5px solid var(--border);padding:10px 0">
          <div class="between">
            <span style="font-size:13px;font-weight:600">${p.no_pengajuan_transfer}</span>
            <span class="badge badge-${p.status==='sudah_transfer'?'selesai':'pending'}">${p.status.replace(/_/g,' ')}</span>
          </div>
          <div class="between" style="margin-top:4px">
            <span class="muted" style="font-size:12px">${p._notaList.length} nota</span>
            <span style="font-size:13px;font-weight:600">${fmtRupiah(p.total_nominal)}</span>
          </div>
          ${p.jumlah_transfer_aktual != null && Number(p.jumlah_transfer_aktual) !== Number(p.total_nominal) ? `
          <div class="between" style="margin-top:2px">
            <span class="muted" style="font-size:12px">Nominal aktual ditransfer</span>
            <span class="muted" style="font-size:12px">${fmtRupiah(p.jumlah_transfer_aktual)}</span>
          </div>` : ""}
          ${role === "owner" ? `<button class="danger" style="width:100%;margin-top:8px;font-size:12px" data-voidtransfer="${p.id}">Void pengajuan ini</button>` : ""}
        </div>`).join("")}
    </div>`;
  }

  renderShell(html);

  document.querySelectorAll("[data-topup]").forEach(el => el.onchange = () => toggleTopupPilih(el.dataset.topup));
  const btnTopup = document.getElementById("btnSubmitTopup");
  if(btnTopup) btnTopup.onclick = submitTopup;

  document.querySelectorAll("[data-approve]").forEach(el => el.onclick = () => approveNota(el.dataset.approve));
  document.querySelectorAll("[data-reject]").forEach(el => el.onclick = () => rejectNota(el.dataset.reject));
  document.querySelectorAll("[data-batalapproval]").forEach(el => el.onclick = () => batalkanApprovalNota(el.dataset.batalapproval));

  document.querySelectorAll("[data-transfer]").forEach(el => el.onchange = () => toggleTransferPilih(el.dataset.transfer));
  const btnTransfer = document.getElementById("btnSubmitTransfer");
  if(btnTransfer) btnTransfer.onclick = submitPengajuanTransfer;

  document.querySelectorAll("[data-wa]").forEach(el => el.onclick = () => copyWAFormat(state.pengajuanTransferMenunggu.find(p => p.id === el.dataset.wa)));
  document.querySelectorAll("[data-print]").forEach(el => el.onclick = () => printPengajuan(state.pengajuanTransferMenunggu.find(p => p.id === el.dataset.print)));
  document.querySelectorAll("[data-sudahtransfer]").forEach(el => el.onclick = () => openKonfirmasiTransferModal(el.dataset.sudahtransfer));
  document.querySelectorAll("[data-tunda]").forEach(el => el.onclick = () => keputusanTransfer(el.dataset.tunda, "tunda"));
  document.querySelectorAll("[data-voidtransfer]").forEach(el => el.onclick = () => voidPengajuanTransfer(el.dataset.voidtransfer));
  document.querySelectorAll("[data-kasjenis]").forEach(el => el.onclick = () => { window.__kasJenis = el.dataset.kasjenis; render(); });
  const btnManualKas = document.getElementById("btnManualKas");
  if(btnManualKas) btnManualKas.onclick = submitManualKas;
}

/* ================= RENDER: LOG AKTIVITAS ================= */
function renderLog(){
  const html = `
    <div class="card">
      <p style="font-weight:600;margin:0 0 12px">Log aktivitas</p>
      <p class="muted" style="margin:0 0 12px">Hanya Owner yang bisa melihat ini.</p>
      ${state.logList.length === 0 ? `<p class="muted">Belum ada aktivitas tercatat.</p>` : state.logList.map(l => `
        <div style="border-bottom:0.5px solid var(--border);padding:10px 0">
          <div class="between">
            <span style="font-size:13px;font-weight:600">${l.aksi.replace(/_/g,' ')}</span>
            <span class="muted" style="font-size:11px">${new Date(l.created_at).toLocaleString('id-ID')}</span>
          </div>
          <span class="muted" style="font-size:12px">${l.profiles?.nama || '-'} · ${l.modul}</span>
        </div>
      `).join("")}
    </div>`;
  renderShell(html);
}

/* ================= RENDER: LAPORAN ================= */
function renderLaporan(){
  const rows = state.laporanRows;
  const totalBelanja = rows.reduce((s,r) => s + r.subtotal, 0);

  const qtyData = state.laporanTabQty === "barang"
    ? groupSum(rows, r => `${r.nama_barang}|${r.satuan}`, r => r.jumlah)
    : groupSum(rows, r => r.kategori, r => r.jumlah);

  const belanjaData = state.laporanTabBelanja === "supplier"
    ? groupSum(rows, r => r.supplier, r => r.subtotal)
    : groupSum(rows, r => r.kategori, r => r.subtotal);

  const html = `
    <div class="card">
      <p style="font-weight:600;margin:0 0 12px">Filter periode</p>
      <div class="row" style="gap:6px;margin-bottom:10px">
        <button style="flex:1;font-size:12px" id="btnPresetHari">Hari ini</button>
        <button style="flex:1;font-size:12px" id="btnPresetMinggu">Minggu ini</button>
        <button style="flex:1;font-size:12px" id="btnPresetBulan">Bulan ini</button>
      </div>
      <div class="row" style="gap:8px">
        <div class="field" style="flex:1;margin-bottom:0"><label class="field-label">Dari</label><input type="date" id="laporanFrom" value="${state.laporanFrom}"></div>
        <div class="field" style="flex:1;margin-bottom:0"><label class="field-label">Sampai</label><input type="date" id="laporanTo" value="${state.laporanTo}"></div>
      </div>
      <button class="primary" style="width:100%;margin-top:10px" id="btnTerapkanLaporan">Terapkan</button>
    </div>

    <div class="card">
      <div class="between" style="margin-bottom:12px">
        <p style="font-weight:600;margin:0">Quantity barang dibeli</p>
      </div>
      <div class="tabs" style="margin:0 0 12px">
        <button class="tab ${state.laporanTabQty==='barang'?'active':''}" data-tabqty="barang">Per barang</button>
        <button class="tab ${state.laporanTabQty==='kategori'?'active':''}" data-tabqty="kategori">Per kategori</button>
      </div>
      ${qtyData.length===0 ? `<p class="muted">Tidak ada data di periode ini.</p>` : qtyData.map(([k,v]) => {
        const [nama, satuan] = state.laporanTabQty === "barang" ? k.split("|") : [k, ""];
        return `<div class="between" style="padding:6px 0;border-bottom:0.5px solid var(--border)">
          <span style="font-size:13px">${nama}</span>
          <span style="font-size:13px;font-weight:600">${v} ${satuan}</span>
        </div>`;
      }).join("")}
    </div>

    <div class="card">
      <div class="between" style="margin-bottom:12px">
        <p style="font-weight:600;margin:0">Pembelanjaan</p>
      </div>
      <div class="tabs" style="margin:0 0 12px">
        <button class="tab ${state.laporanTabBelanja==='supplier'?'active':''}" data-tabbelanja="supplier">Per supplier</button>
        <button class="tab ${state.laporanTabBelanja==='kategori'?'active':''}" data-tabbelanja="kategori">Per kategori</button>
      </div>
      ${belanjaData.length===0 ? `<p class="muted">Tidak ada data di periode ini.</p>` : belanjaData.map(([k,v]) => `
        <div class="between" style="padding:6px 0;border-bottom:0.5px solid var(--border)">
          <span style="font-size:13px">${k}</span>
          <span style="font-size:13px;font-weight:600">${fmtRupiah(v)}</span>
        </div>`).join("")}
      <div class="between" style="margin-top:10px;font-weight:600;border-top:0.5px solid var(--border-strong);padding-top:8px">
        <span>Total periode ini</span>
        <span>${fmtRupiah(totalBelanja)}</span>
      </div>
    </div>

    <div class="card">
      <p style="font-weight:600;margin:0 0 4px">Riwayat nota (detail)</p>
      <p class="muted" style="margin:0 0 12px">Per baris barang: tanggal, supplier, harga, dan tanggal diganti.</p>
      <div class="row" style="gap:8px;margin-bottom:10px">
        <select id="filterKategoriNota" style="flex:1">
          <option value="">Semua kategori</option>
          ${state.kategoriList.map(k => `<option value="${k.id}" ${state.laporanNotaKategori===k.id?'selected':''}>${k.nama_kategori}</option>`).join("")}
        </select>
        <select id="filterSupplierNota" style="flex:1">
          <option value="">Semua supplier</option>
          ${[...new Set(state.laporanRows.map(r => r.supplier))].map(s => `<option value="${s}" ${state.laporanNotaSupplier===s?'selected':''}>${s}</option>`).join("")}
        </select>
      </div>
      <button style="width:100%;margin-bottom:12px;font-size:13px" id="btnExportCsv">⬇ Export ke Excel (CSV)</button>
      <div style="overflow-x:auto">
        ${filterLaporanNota().length===0 ? `<p class="muted">Tidak ada data untuk filter ini.</p>` : filterLaporanNota().map(r => `
          <div style="border-bottom:0.5px solid var(--border);padding:8px 0">
            <div class="between">
              <span style="font-size:13px;font-weight:600">${r.nama_barang}</span>
              <span style="font-size:13px;font-weight:600">${fmtRupiah(r.subtotal)}</span>
            </div>
            <div class="row" style="gap:6px;flex-wrap:wrap;margin-top:2px">
              <span class="muted" style="font-size:11px">${r.tanggal}</span>
              <span class="muted" style="font-size:11px">· ${r.supplier}</span>
              <span class="muted" style="font-size:11px">· ${r.kategori}</span>
              <span class="muted" style="font-size:11px">· ${r.jumlah} ${r.satuan} × ${fmtRupiah(r.harga_satuan)}</span>
            </div>
            <div class="muted" style="font-size:11px;margin-top:2px">
              Diganti: ${r.tanggal_diganti || "Belum diganti"}
            </div>
          </div>
        `).join("")}
      </div>
    </div>`;

  renderShell(html);

  document.getElementById("btnPresetHari").onclick = () => setPresetLaporan("hari");
  document.getElementById("btnPresetMinggu").onclick = () => setPresetLaporan("minggu");
  document.getElementById("btnPresetBulan").onclick = () => setPresetLaporan("bulan");
  document.getElementById("btnTerapkanLaporan").onclick = async () => {
    state.laporanFrom = document.getElementById("laporanFrom").value;
    state.laporanTo = document.getElementById("laporanTo").value;
    await loadLaporan();
    render();
  };
  document.querySelectorAll("[data-tabqty]").forEach(el => el.onclick = () => { state.laporanTabQty = el.dataset.tabqty; render(); });
  document.querySelectorAll("[data-tabbelanja]").forEach(el => el.onclick = () => { state.laporanTabBelanja = el.dataset.tabbelanja; render(); });
  document.getElementById("filterKategoriNota").onchange = (e) => { state.laporanNotaKategori = e.target.value; render(); };
  document.getElementById("filterSupplierNota").onchange = (e) => { state.laporanNotaSupplier = e.target.value; render(); };
  document.getElementById("btnExportCsv").onclick = exportLaporanNotaCsv;
}

/* ================= MAIN RENDER ================= */
function render(){
  if(!state.session || !state.profile){ renderLogin(); return; }
  if(state.view === "master") renderMaster();
  else if(state.view === "nota") renderNota();
  else if(state.view === "kas") renderKas();
  else if(state.view === "log") renderLog();
  else if(state.view === "laporan") renderLaporan();
  else renderPermintaan();
}

/* ================= INIT ================= */
/* ================= PWA: DAFTARKAN SERVICE WORKER ================= */
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((e) => console.error("SW gagal daftar:", e));
  });
}

(async function init(){
  const { data } = await sb.auth.getSession();
  if(data.session){
    state.session = data.session;
    await loadProfile();
    await loadMasterData();
    await expireOldPermintaan();
    await loadTiketList();
    await loadPermintaanTerbuka();
    await loadNotaList();
    await loadTerimaList();
    await loadTerimaLuarList();
    await loadKasData();
    if(state.profile.role === "owner") await loadLogAktivitas();
  }
  render();
})();
</script>
</body>
</html>
